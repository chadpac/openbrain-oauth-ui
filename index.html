<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Brain Authorization</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7f9;color:#18212f;margin:0;min-height:100vh;display:grid;place-items:center}
    .card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h1{margin:0 0 12px;font-size:28px}.muted{color:#667085;line-height:1.55}.hidden{display:none!important}
    label{display:block;font-weight:600;margin:14px 0 6px}
    input{width:100%;padding:12px 13px;border:1px solid #cfd4dc;border-radius:10px;font-size:16px;box-sizing:border-box}
    button{margin-top:16px;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:650;cursor:pointer;background:#111827;color:#fff}
    .error,.ok{padding:12px;border-radius:10px;margin:14px 0}.error{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}.ok{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
  </style>
</head>
<body>
  <main class="card">
    <section id="info">
      <h1>Open Brain</h1>
      <p class="muted">This site is used only for secure OAuth authorization of Open Brain AI connections.</p>
      <div id="signinStatus"></div>
    </section>

    <section id="reset" class="hidden">
      <h1>Choose a new password</h1>
      <p class="muted">Set a password for your Open Brain account. This password is separate from your Supabase dashboard login.</p>
      <div id="message"></div>
      <form id="resetForm">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="confirm">Confirm new password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
        <button type="submit">Save password</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm";
    const sb = createClient(
      "https://prctfnpbftjepdckwpao.supabase.co",
      "sb_publishable_Dk6egByVuZmSuI8tp0h1fg_hpki5iOE"
    );

    const info = document.getElementById("info");
    const reset = document.getElementById("reset");
    const message = document.getElementById("message");
    const signinStatus = document.getElementById("signinStatus");

    async function resumePendingAuthorization() {
      const { data } = await sb.auth.getSession();
      if (!data.session) return false;

      const pendingId = localStorage.getItem("openbrain_pending_authorization_id");
      if (pendingId) {
        localStorage.removeItem("openbrain_pending_authorization_id");
        location.replace(
          "/openbrain-oauth-ui/oauth/consent/?authorization_id=" +
            encodeURIComponent(pendingId)
        );
        return true;
      }

      location.replace("/openbrain-oauth-ui/dashboard/");
      return true;
    }

    function showReset() {
      info.classList.add("hidden");
      reset.classList.remove("hidden");
    }

    function showMessage(text, kind="error") {
      message.innerHTML = "";
      const div = document.createElement("div");
      div.className = kind;
      div.textContent = text;
      message.appendChild(div);
    }

    const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    if (hash.get("type") === "recovery" || hash.get("access_token")) {
      showReset();
    }

    sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        showReset();
        return;
      }
      if (event === "SIGNED_IN") {
        resumePendingAuthorization();
      }
    });

    resumePendingAuthorization();

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        showMessage("The passwords do not match.");
        return;
      }

      const { error } = await sb.auth.updateUser({ password });
      if (error) {
        showMessage(error.message);
        return;
      }

      showMessage("Password saved. Return to Gemini and sign in again with this Open Brain password.", "ok");
      e.target.reset();
    });
  </script>
</body>
</html>
